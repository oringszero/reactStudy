<!DOCTYPE html>
<html>
<body>
    <div id="root"></div>
</body>
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
    <script type="text/babel">
        
        function App() {
            const [minutes, setMinutes] = React.useState();

            const onChangeMinutes = (event) => {
                setMinutes(event.target.value);
                console.log(minutes);
            }
            return (
                <div>
                    <h1 className="hi">Super Converter</h1>
                    <label htmlFor="minutes">Minutes</label>
                    <input value={minutes} id="minutes" type="number" placeholder="Minutes" onChange={onChangeMinutes}/>
                    <h4>{minutes} minutes is {minutes * 60} seconds.</h4>
                    <label htmlFor="hours">Hours</label>
                    <input id="hours" type="number" placeholder="Hours" />
                </div>
            );
        }

        const root = document.getElementById('root');
        ReactDOM.render(<App />, root);
    </script>
</html>
